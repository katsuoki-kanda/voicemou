<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Voice Mouse - Advanced Control</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: sans-serif; text-align: center; overflow: hidden; }
        .ui { padding: 15px; background: #222; border-bottom: 2px solid #333; }
        button { padding: 15px 20px; font-size: 18px; background: #0f0; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        #debug { color: #fff; font-family: monospace; font-size: 18px; margin-top: 10px; white-space: pre-wrap; word-wrap: break-word; }
        #log { color: #ffeb3b; font-size: 16px; margin-top: 5px; height: 3em; overflow: hidden; font-weight: bold; }
        canvas { width: 80vw; height: 60vh; background: #111; border: 1px solid #444; margin-top: 20px; object-fit: contain; }
    </style>
</head>
<body>

    <div class="ui">
        <button id="connectBtn">1. ESP32に接続</button>
        <button id="micBtn" disabled>2. 音声認識を開始</button>
        <div id="debug">まずはESP32にBluetooth接続してください。</div>
        <div id="log">音声認識の履歴やエラーがここに出ます...</div>
    </div>
    
    <canvas id="output_canvas" width="800" height="600"></canvas>

<script>
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const debugEl = document.getElementById('debug');
const logEl = document.getElementById('log');
const connectBtn = document.getElementById('connectBtn');
const micBtn = document.getElementById('micBtn');

// BLE設定
let characteristic;
const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
const CHAR_UUID    = "19b10001-e8f2-537e-4f6c-d104768a1214";

// 座標と移動速度の管理
let currentX = 0.5; 
let currentY = 0.5; 

// 移動方向 (-1, 0, 1)
let dirX = 0;         
let dirY = 0;         

// 速度設定
const NORMAL_SPEED = 0.002; 
const SLOW_SPEED = NORMAL_SPEED / 6; 

// 低速制御用変数
let moveStartTime = 0;             // 移動を開始した時間
let isIntentionallySlow = false;   // 「おそく」と言われたかどうかのフラグ

// 通信制御用
let isSending = false;
let nextData = null;

// 音声認識用変数
let recognition = null;
let isListening = false;
let isIntentionalStop = false;

// ===== 1. Bluetooth接続処理 =====
connectBtn.addEventListener('click', async () => {
    try {
        debugEl.innerText = "デバイスを探しています...";
        const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(CHAR_UUID);
        
        debugEl.innerText = "ESP32接続成功！次に「音声認識を開始」を押してください。";
        micBtn.disabled = false;
        
        requestAnimationFrame(updateLoop);
        
    } catch (e) { 
        debugEl.innerText = "接続失敗またはキャンセルされました。";
        console.error(e);
    }
});

// ===== 2. 音声認識のセットアップ =====
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.continuous = true;       
    recognition.interimResults = true;   

    recognition.onstart = () => {
        isListening = true;
        isIntentionalStop = false;
        micBtn.innerText = "音声認識中 (クリックで停止)";
        micBtn.style.background = "#f00";
        micBtn.style.color = "#fff";
        updateDebugState("マイク待機中...");
        logEl.innerText = "システム: 音声入力を待機しています...";
    };

    recognition.onsoundstart = () => {
        logEl.innerText = "システム: 音を検知しました。解析中...";
    };

    recognition.onresult = (event) => {
        let latestTranscript = "";
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            latestTranscript += event.results[i][0].transcript;
        }
        
        logEl.innerText = "認識結果: " + latestTranscript;
        handleCommand(latestTranscript);
    };

    recognition.onerror = (event) => {
        console.error("音声認識エラー:", event.error);
        let errorReason = event.error;
        if (event.error === 'network') errorReason = "ネットワーク通信エラー";
        else if (event.error === 'no-speech') errorReason = "音声が検出されません";
        else if (event.error === 'not-allowed') {
            errorReason = "マイクの使用が許可されていません";
            isIntentionalStop = true;
        }
        logEl.innerText = "⚠️ エラー発生: " + errorReason;
    };

    recognition.onend = () => {
        isListening = false;
        if (!isIntentionalStop) {
            setTimeout(() => {
                if (!isListening && !isIntentionalStop) {
                    try { recognition.start(); } catch (e) { console.error(e); }
                }
            }, 500);
        }
    };
} else {
    debugEl.innerText = "お使いのブラウザはWeb Speech APIに対応していません。Chromeを使用してください。";
}

micBtn.addEventListener('click', () => {
    if (recognition) {
        if (!isListening) {
            isIntentionalStop = false;
            try { recognition.start(); } catch (e) { console.error(e); }
        } else {
            isIntentionalStop = true;
            recognition.stop();
            micBtn.innerText = "音声認識を開始";
            micBtn.style.background = "#0f0";
            micBtn.style.color = "#000";
            updateDebugState("音声認識を停止しました。");
        }
    }
});

// ===== 3. コマンド解析と動作の割り当て =====
function handleCommand(text) {
    // 【優先1】ジャンプコマンド（部分一致の誤動作を防ぐため最初に判定）
    if (text.includes('真ん中') || text.includes('まんなか') || text.includes('センター')) {
        jumpTo(0.5, 0.5, "中央へジャンプ");
        return;
    }
    if (text.includes('画面左') || text.includes('がめんひだり')) {
        jumpTo(0.0, 0.5, "画面左端へジャンプ");
        return;
    }
    if (text.includes('画面右') || text.includes('がめんみぎ')) {
        jumpTo(1.0, 0.5, "画面右端へジャンプ");
        return;
    }

    // 【優先2】速度変更コマンド
    if (text.includes('遅く') || text.includes('おそく') || text.includes('ゆっくり')) {
        isIntentionallySlow = true; 
        // 速度変更はそのまま下の方向判定も通す（「ゆっくり上」などの同時発話対応）
    }

    // 【優先3】停止・クリック
    if (text.includes('停止') || text.includes('ていし') || text.includes('ストップ')) {
        setDirection(0, 0);
        updateDebugState("停止中");
        return;
    } 
    if (text.includes('ダブル')) {
        triggerDoubleClick();
        return;
    } 
    if (text.includes('クリック')) {
        triggerClick();
        return;
    }

    // 【優先4】方向移動コマンド
    if (text.includes('上') || text.includes('うえ')) {
        setDirection(0, -1);
    } 
    else if (text.includes('下') || text.includes('した')) {
        setDirection(0, 1);
    } 
    else if (text.includes('左') || text.includes('ひだり')) {
        setDirection(-1, 0);
    } 
    else if (text.includes('右') || text.includes('みぎ')) {
        setDirection(1, 0);
    }
}

// 方向をセットする関数（初動のタイマーリセット等も含む）
function setDirection(newDirX, newDirY) {
    // 完全に停止している状態から動き出す瞬間にタイマーをセット
    if (dirX === 0 && dirY === 0 && (newDirX !== 0 || newDirY !== 0)) {
        moveStartTime = Date.now();
        isIntentionallySlow = false; // 意図的低速フラグをリセット
    }
    dirX = newDirX;
    dirY = newDirY;
}

// ジャンプ実行関数
function jumpTo(x, y, msg) {
    setDirection(0, 0); // 移動を停止
    currentX = x;
    currentY = y;
    sendData(currentX, currentY, false); // 即座にESP32に送信
    updateDebugState(msg);
}

function updateDebugState(stateMsg) {
    debugEl.innerText = `状態: ${stateMsg}\n現在の座標: X: ${Math.round(currentX * 100)}%, Y: ${Math.round(currentY * 100)}%`;
}

// ===== 4. クリック＆ダブルクリック制御 =====
async function triggerClick() {
    setDirection(0, 0); // クリック時は移動を停止
    updateDebugState("クリック実行");
    sendData(currentX, currentY, true);  
    await new Promise(r => setTimeout(r, 100));
    sendData(currentX, currentY, false); 
}

async function triggerDoubleClick() {
    setDirection(0, 0);
    updateDebugState("ダブルクリック実行");
    sendData(currentX, currentY, true);  
    await new Promise(r => setTimeout(r, 80));
    sendData(currentX, currentY, false); 
    await new Promise(r => setTimeout(r, 80));
    sendData(currentX, currentY, true);  
    await new Promise(r => setTimeout(r, 80));
    sendData(currentX, currentY, false); 
}

// ===== 5. メインループ（座標更新と描画） =====
function updateLoop() {
    if (dirX !== 0 || dirY !== 0) {
        const elapsed = Date.now() - moveStartTime;
        let currentSpeed = NORMAL_SPEED;
        
        // 動き始め3秒以内、または「おそく」と指示された場合は1/4の速度
        if (isIntentionallySlow || elapsed < 3000) {
            currentSpeed = SLOW_SPEED;
        }

        currentX = Math.max(0, Math.min(1, currentX + dirX * currentSpeed));
        currentY = Math.max(0, Math.min(1, currentY + dirY * currentSpeed));
        
        sendData(currentX, currentY, false);
        
        let speedText = (currentSpeed === SLOW_SPEED) ? "移動中 (低速)" : "移動中 (通常速度)";
        updateDebugState(speedText);
    }

    drawUI();
    requestAnimationFrame(updateLoop);
}

function drawUI() {
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    
    canvasCtx.strokeStyle = "#333";
    canvasCtx.beginPath();
    canvasCtx.moveTo(canvasElement.width / 2, 0); canvasCtx.lineTo(canvasElement.width / 2, canvasElement.height);
    canvasCtx.moveTo(0, canvasElement.height / 2); canvasCtx.lineTo(canvasElement.width, canvasElement.height / 2);
    canvasCtx.stroke();

    let px = currentX * canvasElement.width;
    let py = currentY * canvasElement.height;

    canvasCtx.fillStyle = (dirX === 0 && dirY === 0) ? "yellow" : "lime";
    canvasCtx.beginPath();
    canvasCtx.arc(px, py, 15, 0, 2 * Math.PI);
    canvasCtx.fill();
    canvasCtx.strokeStyle = "white";
    canvasCtx.stroke();
}

// ===== 6. ESP32へのデータ送信処理 =====
function sendData(px, py, click) {
    nextData = { px, py, click };
    processQueue();
}

async function processQueue() {
    if (isSending || !characteristic || !nextData) return;
    
    isSending = true;
    const { px, py, click } = nextData;
    nextData = null; 

    const xVal = Math.max(0, Math.min(32767, Math.round(px * 32767)));
    const yVal = Math.max(0, Math.min(32767, Math.round(py * 32767)));
    
    const buffer = new Uint8Array(5);
    buffer[0] = xVal & 0xFF;
    buffer[1] = (xVal >> 8) & 0xFF;
    buffer[2] = yVal & 0xFF;
    buffer[3] = (yVal >> 8) & 0xFF;
    buffer[4] = click ? 1 : 0;
    
    try {
        await characteristic.writeValue(buffer);
    } catch (e) { console.error(e); }
    
    isSending = false;
    if (nextData) processQueue();
}
</script>
</body>
</html>
